<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Нейроферма</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e17;--panel:#161b2a;--line:#2a3147;--text:#e9ecf5;--dim:#8d96b2;--neon:#5df2c4;--star:#ffc93c;--bad:#ff6b7a;--glow:#5df2c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--text);font:500 15px/1.35 Manrope,system-ui,sans-serif;overflow-x:hidden}
body{padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 84px)}
body.hot{--glow:#ffc93c}
body.overheat{--glow:#ff6b7a}
body.overheat .core{animation:shake .2s infinite}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
.top{text-align:center;padding:12px 0 0}
.bal{font:800 36px Unbounded,sans-serif;color:var(--glow);text-shadow:0 0 24px var(--glow);transition:color .4s}
.sub{color:var(--dim);font-size:13px}
.rate-badge{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--neon);font:700 12px Manrope,sans-serif}
.boost{display:inline-block;margin:6px 4px 0;padding:3px 12px;border-radius:99px;background:var(--star);color:#1b1500;font-weight:700;font-size:13px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#chest{display:block;margin:8px auto 0;padding:7px 16px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:700 13px Manrope,sans-serif}
#chest.ready{border-color:var(--star);color:var(--star);animation:pulse .8s ease-in-out infinite;box-shadow:0 0 22px #ffc93c66}
.tapzone{position:relative;display:grid;place-items:center;height:270px}
.core{position:relative;width:270px;height:270px;display:grid;place-items:center}
#tap{position:relative;z-index:2;width:164px;height:164px;border-radius:50%;border:0;color:#04251c;font:800 14px Unbounded,sans-serif;
 background:radial-gradient(circle at 35% 30%,#fff,var(--glow) 50%,#0c5f4a);
 box-shadow:0 0 0 8px color-mix(in srgb,var(--glow) 14%,transparent),0 0 70px color-mix(in srgb,var(--glow) 55%,transparent);
 animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--glow) 8%,transparent),0 0 100px color-mix(in srgb,var(--glow) 70%,transparent)}}
.ring{position:absolute;inset:36px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--glow) 35%,transparent);animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sat{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);animation:orb var(--d) linear infinite;opacity:0;transition:opacity .6s}
.sat.on{opacity:1}
@keyframes orb{from{transform:rotate(var(--a)) translateX(var(--r))}to{transform:rotate(calc(var(--a) + 360deg)) translateX(var(--r))}}
.combo{height:34px;text-align:center}
.combo b{font:800 15px Unbounded,sans-serif;color:var(--star)}
.cbar{height:5px;margin:4px auto 0;width:150px;background:var(--line);border-radius:9px;overflow:hidden}
.cbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--star))}
.fly{position:fixed;z-index:9;pointer-events:none;font:800 18px Unbounded,sans-serif;color:var(--neon);text-shadow:0 0 10px currentColor;animation:fly .9s ease-out forwards}
.fly.crit{color:var(--star);font-size:28px}
@keyframes fly{to{transform:translateY(-90px) scale(1.15);opacity:0}}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translate(5px,-3px)}50%{transform:translate(-5px,3px)}75%{transform:translate(3px,2px)}}
.gold{position:fixed;z-index:8;left:0;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 30%,#fff7d6,var(--star) 55%,#b57600);box-shadow:0 0 30px var(--star),0 0 70px #ffc93c88}
.bug{position:fixed;z-index:8;font-size:40px;animation:crawl 2.2s linear forwards}
@keyframes crawl{from{transform:translateX(-30px) rotate(-20deg)}to{transform:translateX(60px) rotate(20deg);opacity:.2}}
.ev{position:fixed;z-index:9;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:var(--panel);border:1px solid var(--star);border-radius:14px;padding:10px 14px;box-shadow:0 0 30px #0009}
.ev b{display:block}.ev small{color:var(--dim)}
.ev .cbar{width:100%;height:7px}
.toast{position:fixed;z-index:10;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-160%);padding:10px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--star);font-weight:700;text-align:center;max-width:90vw;transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
.toast.show{transform:translate(-50%,0)}
.tabs,.chips{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:12px;margin-bottom:10px}
.chips{background:none;padding:0}
.tabs button,.chips button{flex:1;padding:9px;border:0;border-radius:9px;background:none;color:var(--dim);font:700 14px Manrope,sans-serif}
.chips button{border:1px solid var(--line)}
.tabs button.on,.chips button.on{background:var(--line);color:var(--text)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.03);border-color:var(--neon)}}
.row .info{flex:1;min-width:120px}
.row b{display:block}.row small{color:var(--dim)}
.em{font-size:28px}
.acts{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.acts input, .auth-form input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:700 14px Manrope,sans-serif;outline:none;user-select:text}
.acts input{width:84px}
.buy{min-width:92px;padding:9px 10px;border:0;border-radius:9px;background:var(--neon);color:#04251c;font:700 13px Manrope,sans-serif;transition:transform .1s}
.buy:active{transform:scale(.94)}
.buy:disabled{background:var(--line);color:var(--dim)}
.buy.star{background:var(--star);color:#1b1500}
.buy.alt{background:var(--line);color:var(--text)}
.reset{width:100%;margin-top:6px;padding:12px;border-radius:12px;border:1px dashed var(--bad);background:none;color:var(--bad);font:700 14px Manrope,sans-serif}
.reset:disabled{opacity:.4}
.cnt{font:800 13px Unbounded,sans-serif;color:var(--dim)}
.coins{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.coins b{font:800 20px Unbounded,sans-serif;color:var(--star)}
h3{margin:14px 0 8px;font-size:14px;color:var(--dim)}

/* Экран авторизации/регистрации */
#authScreen{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;padding:20px}
.auth-container{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
.auth-container h2{margin:0 0 16px;text-align:center;font-family:Unbounded,sans-serif;font-size:20px;color:var(--neon)}
.auth-form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.auth-btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--neon);color:#04251c;font:700 15px Manrope,sans-serif;cursor:pointer;margin-top:4px;transition:transform .1s}
.auth-btn:active{transform:scale(0.98)}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>

<!-- Экран авторизации и регистрации -->
<div id="authScreen">
  <div class="auth-container">
    <h2>Нейроферма</h2>
    <div class="tabs" id="authTabs">
      <button data-t="login" class="on">Вход</button>
      <button data-t="register">Регистрация</button>
    </div>
    
    <!-- Форма входа -->
    <div id="loginForm" class="auth-form">
      <div class="sub">Введите ваш логин и пароль для входа:</div>
      <input type="text" id="loginUser" placeholder="Логин или Email" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Пароль" autocomplete="current-password">
      <button class="auth-btn" id="loginBtn">Войти в игру</button>
    </div>

    <!-- Форма регистрации -->
    <div id="registerForm" class="auth-form" hidden>
      <div class="sub">Создайте новый аккаунт в системе:</div>
      <input type="text" id="regUser" placeholder="Придумайте логин" autocomplete="username">
      <input type="password" id="regPass" placeholder="Придумайте пароль" autocomplete="new-password">
      <button class="auth-btn" id="regBtn">Зарегистрироваться</button>
    </div>
  </div>
</div>

<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>
<div class="ev" id="ev" hidden><b id="evt"></b><small id="evd"></small><div class="cbar"><i id="evb"></i></div></div>
<div class="wrap" id="gameWrap" hidden>
  <div class="top">
    <div class="bal" id="bal">0</div>
    <div class="sub"><span id="ps">0</span> токенов/сек · веса: <span id="wt">0</span></div>
    <div class="rate-badge" id="rateBadge">Курс: 1$ = 1M токенов</div>
    <div id="boost"></div>
    <button id="chest" hidden></button>
  </div>
  <div class="tapzone"><div class="core" id="core"><div class="ring"></div><div id="sats"></div><button id="tap">ГЕНЕРИРОВАТЬ</button></div></div>
  <div class="combo"><b id="combo"></b><div class="cbar"><i id="cbar"></i></div></div>

  <div class="tabs" id="tabs"><button data-t="farm" class="on">Ферма</button><button data-t="shop">Магазин</button><button data-t="market">Биржа</button></div>

  <section id="farm"><div id="gens"></div><button class="reset" id="prestige"></button></section>

  <section id="shop" hidden>
    <div class="chips" id="shopchips"><button data-t="ups" class="on">Апгрейды</button><button data-t="don">Донаты ⭐</button></div>
    <div id="ups"></div>
    <div id="don" hidden><div id="items"></div><p class="sub">Покупка монет биржи и бустов за Telegram Stars.</p></div>
  </section>

  <section id="market" hidden>
    <div class="coins"><span>🪙 <b id="coins">0</b></span><span class="sub">Комиссия биржи 5%</span></div>
    <div class="chips" id="mchips"><button data-t="mk" class="on">Рынок</button><button data-t="bag">Рюкзак</button></div>
    <div id="mk"></div><div id="bag" hidden></div>
  </section>
</div>

<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const API = "https://your-server-domain.com/api"; // Укажи адрес своего Python сервера

// ---------- Логика авторизации и регистрации ----------
const AUTH_KEY = "neurofarm_auth_user";

function checkAuthUser() {
  const savedUser = localStorage.getItem(AUTH_KEY);
  if (savedUser) {
    $("authScreen").hidden = true;
    $("gameWrap").hidden = false;
    initGame();
  }
}

// Переключение табов в окне авторизации
const authTabs = $("authTabs");
authTabs.addEventListener("click", e => {
  const t = e.target.dataset.t;
  if(!t) return;
  [...authTabs.children].forEach(b => b.classList.toggle("on", b === e.target));
  $("loginForm").hidden = (t !== "login");
  $("registerForm").hidden = (t !== "register");
});

// Кнопка входа
$("loginBtn").onclick = async () => {
  const u = $("loginUser").value.trim();
  const p = $("loginPass").value.trim();
  if(!u || !p) return toast("⚠️ Заполните все поля");
  
  // Пример запроса к бэкенду (при необходимости можно заменить на локальную проверку)
  const res = await api("/login", { username: u, password: p });
  if (res && res.error) {
    return toast("⚠️ " + res.error);
  }

  localStorage.setItem(AUTH_KEY, u);
  toast("✅ Успешный вход!");
  setTimeout(() => {
    $("authScreen").hidden = true;
    $("gameWrap").hidden = false;
    initGame();
  }, 500);
};

// Кнопка регистрации
$("regBtn").onclick = async () => {
  const u = $("regUser").value.trim();
  const p = $("regPass").value.trim();
  if(!u || !p) return toast("⚠️ Заполните все поля");
  if(p.length < 4) return toast("⚠️ Пароль слишком короткий (от 4 символов)");

  // Запрос на регистрацию на бэкенд
  const res = await api("/register", { username: u, password: p });
  if (res && res.error) {
    return toast("⚠️ " + res.error);
  }
  
  localStorage.setItem(AUTH_KEY, u);
  toast("🎉 Регистрация успешна!");
  setTimeout(() => {
    $("authScreen").hidden = true;
    $("gameWrap").hidden = false;
    initGame();
  }, 500);
};

// Проверяем авторизацию при загрузке
checkAuthUser();


const GENS = [
  ["Старый ноутбук",15,0.1,"#8d96b2"],["Домашняя видеокарта",100,1,"#5df2c4"],["Серверная стойка",1100,8,"#4da3ff"],
  ["Мини-ЦОД",12000,47,"#b27bff"],["Нейрокластер",130000,260,"#ff6bd6"],["Квантовый тостер",1.4e6,1400,"#ffc93c"]
];
const UP = [
  {k:"tap",n:"Тонкая настройка",d:l=>`Сила тапа +${l}`,b:25,g:1.8,m:999},
  {k:"cr",n:"Шанс крита",d:l=>`Шанс ×5: ${8+l}%`,b:400,g:2.2,m:22},
  {k:"oh",n:"Склад времени",d:l=>`Офлайн-доход: до ${2+l+(s?.off?6:0)} ч`,b:2000,g:3,m:4},
  {k:"ev",n:"Бонус событий",d:l=>`Награды событий +${l*25}%`,b:1500,g:2.5,m:10}
];
const ITEMS = {
  boost2:{n:"Разгон ×2 на 1 час",d:"Весь доход ×2. Время суммируется",p:15},
  boost5:{n:"Разгон ×5 на 1 час",d:"Весь доход ×5. Время суммируется",p:50},
  auto:{n:"Авто-тап",d:"3 тапа в секунду навсегда",p:100},
  offline:{n:"Работа во сне",d:"Офлайн-доход +6 часов",p:75},
  perm2:{n:"Вечный ×2",d:"Постоянный множитель к доходу",p:250},
  coins1:{n:"500 монет биржи 🪙",d:"Для покупок у других игроков",p:50,c:500},
  coins2:{n:"3000 монет биржи 🪙",d:"Выгоднее на 20%",p:250,c:3000}
};
const RAR = {
  c: ["обычный", "#8d96b2"],
  u: ["редкий", "#4da3ff"],
  r: ["эпик", "#b27bff"],
  e: ["легенда", "#ffc93c"]
};
const DEF = {
  cooler:{n:"Охлаждающая жижа",e:"🧊",r:"c",d:"Доход ×1.5 на 5 минут",npc:10},
  ram:{n:"Планка памяти",e:"💾",r:"u",d:"Сразу +30 минут дохода",npc:40},
  gpu:{n:"Золотая GPU",e:"🎮",r:"r",d:"Доход ×3 на 10 минут",npc:150},
  core:{n:"Ядро сингулярности",e:"🌀",r:"e",d:"+1 вес навсегда",npc:500}
};
const MILES = [1e2,1e3,1e4,1e5,1e6,1e7,1e9,1e12];
const KEY = "neurofarm2";
const def = () => ({t:0,run:0,tot:0,g:GENS.map(()=>0),tap:0,cr:0,oh:0,ev:0,w:0,bu:0,bm:1,fr:0,im:1,iu:0,auto:0,off:0,perm:0,ach:0,last:Date.now()});
let s = Object.assign(def(), JSON.parse(localStorage.getItem(KEY)||"{}"));
if(s.g.length < GENS.length) s.g = GENS.map((_,i) => s.g[i]||0);

const $ = id => document.getElementById(id);
const fmt = n => {const u=["","K","M","B","T","Qa","Qi"];let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return (i?n.toFixed(n<10?2:n<100?1:0):Math.floor(n))+u[i]};
const boostOn = () => s.bu > Date.now(), frOn = () => s.fr > Date.now(), itemOn = () => s.iu > Date.now();
const mult = () => (1 + 0.1 * s.w) * (s.perm ? 2 : 1) * (boostOn() ? s.bm : 1) * (frOn() ? 7 : 1) * (itemOn() ? s.im : 1);
const ps = () => GENS.reduce((a,g,i) => a + s.g[i] * g[2], 0) * mult();
const tapPow = () => (1 + s.tap) * mult();
const gCost = i => Math.ceil(GENS[i][1] * Math.pow(1.15, s.g[i]));
const uCost = u => Math.ceil(u.b * Math.pow(u.g, s[u.k]));
const gain = n => {s.t += n; s.run += n; s.tot += n};
const prestigeGain = () => Math.floor(Math.sqrt(s.run / 1e5));
const save = () => {s.last = Date.now(); localStorage.setItem(KEY, JSON.stringify(s))};
const hap = (t, k="impactOccurred") => tg?.HapticFeedback?.[k]?.(t);
const mmss = ms => {const r = Math.max(0, Math.ceil(ms/1000)); return Math.floor(r/60) + ":" + String(r%60).padStart(2,"0")};

let toastT;
function toast(msg){const e = $("toast"); e.textContent = msg; e.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("show"), 2600)}

// ---------- частицы ----------
const cv = $("fx"), cx = cv.getContext("2d"); let P = [], W = 0, H = 0;
function size(){const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d,0,0,d,0,0)}
addEventListener("resize", size); size();
function burst(x, y, n, color, speed=5){for(let i=0; i<n; i++){const a = Math.random()*6.283, v = (0.4+Math.random())*speed; P.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-1, l:0, m:30+Math.random()*25, r:2+Math.random()*3, c:color, g:0.12})}}
const coreXY = () => {const r = $("core").getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]};
function frame(){
  cx.clearRect(0, 0, W, H);
  const rate = Math.min(0.5, 0.03 + Math.log10(1+ps()) * 0.05);
  if(Math.random() < rate && P.length < 220) P.push({x:Math.random()*W, y:H+10, vx:0, vy:-(0.5+Math.random()*1.2), l:0, m:H/1.2, t:Math.random()<.5?"0":"1", r:12+Math.random()*6, c:document.body.classList.contains("hot")?"#ffc93c":"#5df2c4", g:0, bg:1});
  for(let i = P.length-1; i >= 0; i--){const p = P[i]; p.l++; p.x += p.vx; p.y += p.vy; p.vy += p.g;
    const a = Math.max(0, 1 - p.l/p.m); if(p.l >= p.m){P.splice(i,1); continue}
    cx.globalAlpha = p.bg ? a*0.22 : a; cx.fillStyle = p.c;
    if(p.bg){cx.font = `700 ${p.r}px Unbounded,monospace`; cx.fillText(p.t, p.x, p.y)}else{cx.beginPath(); cx.arc(p.x, p.y, p.r*a+0.5, 0, 6.283); cx.fill()}}
  cx.globalAlpha = 1; requestAnimationFrame(frame)}
frame();

// ---------- разметка ----------
$("sats").innerHTML = GENS.map((g,i)=>`<div class="sat" id="sat${i}" style="--c:${g[3]};--r:${86+i*8}px;--d:${5+i*2.2}s;--a:${i*60}deg"></div>`).join("");
$("gens").innerHTML = GENS.map((g,i)=>`<div class="row" id="r${i}"><div class="info"><b>${g[0]} <span class="cnt" id="c${i}"></span></b><small>+${fmt(g[2])}/сек каждый</small></div><button class="buy" data-g="${i}" id="b${i}"></button></div>`).join("");
$("ups").innerHTML = UP.map(u=>`<div class="row"><div class="info"><b>${u.n} <span class="cnt" id="ul_${u.k}"></span></b><small id="ud_${u.k}"></small></div><button class="buy" data-u="${u.k}" id="ub_${u.k}"></button></div>`).join("");
$("items").innerHTML = Object.entries(ITEMS).map(([k,v])=>`<div class="row"><div class="info"><b>${v.n}</b><small>${v.d}</small></div><button class="buy star" data-i="${k}" id="s_${k}">${v.p} ⭐</button></div>`).join("");

function bind(sel, ids, cb){$(sel).addEventListener("click", e => {const t = e.target.dataset.t; if(!t) return; [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b === e.target)); ids.forEach(i => $(i).hidden = i !== t); cb && cb(t)})}
bind("tabs", ["farm","shop","market"], t => {if(t === "market") loadMarket()});
bind("shopchips", ["ups","don"]);
bind("mchips", ["mk","bag"], () => loadMarket());

// ---------- Серверные запросы ----------
let st = {coins:0, inv:{}, next:0, mine:[], rate:1000000}, lots = [];
const userId = tg?.initDataUnsafe?.user?.id || "test_user";

async function api(p, b={}){
  if(!API) return {error:"Нет API"};
  try{
    const r = await fetch(API + p, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({...b, user_id: userId, initData: tg?.initData || ""})
    });
    return await r.json();
  }catch(e){ return {error:"Ошибка сети бэкенда"} }
}

async function act(p, b){
  const r = await api(p, b);
  if(!r || r.error){ toast("⚠️ " + (r?.error || "Сетевая ошибка")); return null; }
  if(r.state) st = Object.assign(st, r.state);
  return r;
}

const refresh = async () => { const r = await api("/me"); if(r?.state) st = Object.assign(st, r.state); };

// ---------- ящик с предметами ----------
$("chest").onclick = async () => {
  if(Date.now() < st.next) return;
  const r = await act("/drop", {});
  if(!r) return;
  const d = DEF[r.item];
  if(!d) return;
  toast(`📦 Выпало: ${d.e} ${d.n} (${RAR[d.r][0]})`);
  const [x,y] = coreXY(); burst(x, y, 70, RAR[d.r][1], 9); hap("success","notificationOccurred");
};

// ---------- биржа ----------
const card = (it, inner) => {const d = DEF[it]; return d ? `<div class="row" style="border-left:4px solid ${RAR[d.r][1]}">${inner(d)}</div>` : ''};
function rMarket(){
  $("coins").textContent = fmt(st.coins);
  $("mk").innerHTML = lots.length ? lots.map(l => card(l.item, d => `<div class="em">${d.e}</div><div class="info"><b>${d.n}</b><small>${RAR[d.r][0]} · ${d.d}</small></div><button class="buy" data-buy="${l.id}" ${l.mine || st.coins < l.price ? "disabled" : ""}>${l.mine ? "Ваш лот" : fmt(l.price) + " 🪙"}</button>`)).join("") : '<p class="sub">Лотов пока нет. Выставь свой предмет из рюкзака.</p>';
}
function rBag(){
  const inv = Object.entries(st.inv || {});
  $("bag").innerHTML = (inv.length ? inv.map(([k,q]) => card(k, d => `<div class="em">${d.e}</div><div class="info"><b>${d.n} ×${q}</b><small>${RAR[d.r][0]} · ${d.d}</small></div>
   <div class="acts"><button class="buy" data-use="${k}">Применить</button>
   <input type="number" inputmode="numeric" min="1" id="p_${k}" value="${d.npc*2}"><button class="buy alt" data-list="${k}">Выставить</button></div>`)).join("") : '<p class="sub">Рюкзак пуст. Открывай ящики 📦.</p>')
  + ((st.mine || []).length ? '<h3>Мои лоты</h3>' + st.mine.map(l => card(l.item, d => `<div class="em">${d.e}</div><div class="info"><b>${d.n}</b><small>Цена ${fmt(l.price)} 🪙</small></div>`)).join("") : "");
}
async function loadMarket(){
  const r = await act("/market", {});
  if(r){ lots = r.lots || []; rMarket(); rBag(); }
}

function applyItem(k){
  const now = Date.now();
  if(k === "cooler" || k === "gpu"){const m = k === "gpu" ? 3 : 1.5, t = (k === "gpu" ? 600 : 300) * 1000; s.im = itemOn() ? Math.max(s.im, m) : m; s.iu = (itemOn() ? s.iu : now) + t}
  else if(k === "ram") gain(ps() * 1800); else if(k === "core") s.w++;
  toast(`${DEF[k].e} ${DEF[k].n}: активировано`); const [x,y] = coreXY(); burst(x, y, 60, RAR[DEF[k].r][1], 9); save();
}

$("market").addEventListener("click", async e => {
  const d = e.target.dataset;
  if(d.buy){ if(await act("/buy", {id:+d.buy})) { toast("✅ Куплено!"); hap("success","notificationOccurred"); } await loadMarket(); }
  else if(d.use){ if(await act("/use", {item:d.use})) { applyItem(d.use); rBag(); } }
  else if(d.list){
    const price = Math.floor(+$("p_"+d.list).value);
    if(!(price > 0)) return toast("⚠️ Укажи цену");
    if(await act("/list", {item:d.list, price})) { toast("📈 Лот выставлен на рынок"); await loadMarket(); }
  }
});

// ---------- мини-события ----------
let ev = null, evNext = Date.now() + 25000;
function spawnBug(){const b = document.createElement("div"); b.className = "bug"; b.textContent = "🐞"; b.style.left = (10 + Math.random()*75) + "vw"; b.style.top = (25 + Math.random()*55) + "vh";
  b.addEventListener("pointerdown", e => {e.stopPropagation(); b.remove(); if(ev?.type === "bug"){ev.n++; burst(e.clientX, e.clientY, 12, "#ff6b7a", 5); hap("light")}});
  document.body.appendChild(b); setTimeout(() => b.remove(), 2200)}
function evStart(){
  const heat = Math.random() < 0.5;
  ev = heat ? {type:"heat", goal:35, end:Date.now()+10000, n:0, tot:10000, t:"🔥 Перегрев ядра!", d:"Тапай по ядру: 35 раз за 10 секунд"} : {type:"bug", goal:10, end:Date.now()+12000, n:0, tot:12000, t:"🐞 Баги в системе!", d:"Лови жуков: 10 штук за 12 секунд"};
  if(heat) document.body.classList.add("overheat"); else ev.i = setInterval(spawnBug, 650);
  $("ev").hidden = false; $("evt").textContent = ev.t; hap("warning","notificationOccurred")}
function evEnd(win){
  clearInterval(ev.i); document.body.classList.remove("overheat"); $("ev").hidden = true;
  const k = 1 + 0.25 * s.ev;
  if(win){hap("success","notificationOccurred");
    if(ev.type === "heat"){s.fr = Math.max(Date.now(), s.fr) + 15000 * k; toast("🧊 Ядро остыло! Безумие ×7 на " + Math.round(15*k) + " сек")}
    else{const v = Math.max(ps()*90, tapPow()*60) * k; gain(v); toast("🐞 Баги пойманы: +" + fmt(v))}
    const [x,y] = coreXY(); burst(x, y, 70, "#ffc93c", 9)}
  else toast("Событие провалено. Следующее скоро");
  ev = null; evNext = Date.now() + (120 + Math.random()*90) * 1000}

// ---------- UI ----------
let shown = s.t, combo = 0, comboT = 0;
function ui(){
  shown += (s.t - shown) * 0.25; if(Math.abs(s.t - shown) < 0.5) shown = s.t;
  $("bal").textContent = fmt(shown);
  $("ps").textContent = fmt(ps() + (s.auto ? 3*tapPow() : 0));
  $("wt").textContent = s.w;
  
  const usdVal = (s.t / st.rate).toFixed(2);
  $("rateBadge").textContent = `Курс: 1$ = ${fmt(st.rate)} токенов (У вас: ~$${usdVal})`;

  document.body.classList.toggle("hot", boostOn() || frOn() || itemOn());
  const parts = [];
  if(boostOn()) parts.push(`⚡ ×${s.bm} ${Math.floor((s.bu-Date.now())/3600000)}:${String(Math.floor((s.bu-Date.now())%3600000/60000)).padStart(2,"0")}`);
  if(frOn()) parts.push(`🔥 ×7 ${Math.ceil((s.fr-Date.now())/1000)}с`);
  if(itemOn()) parts.push(`🧪 ×${s.im} ${mmss(s.iu-Date.now())}`);
  $("boost").innerHTML = parts.map(p => `<span class="boost">${p}</span>`).join("");
  
  GENS.forEach((g,i)=>{$("c"+i).textContent = "×"+s.g[i]; const c = gCost(i), e = $("b"+i); e.textContent = fmt(c); e.disabled = s.t < c; $("sat"+i).classList.toggle("on", s.g[i] > 0)});
  UP.forEach(u=>{const l = s[u.k], mx = l >= u.m, c = uCost(u), b = $("ub_"+u.k); $("ul_"+u.k).textContent = "ур. "+l; $("ud_"+u.k).textContent = u.d(l); b.textContent = mx ? "Макс" : fmt(c); b.disabled = mx || s.t < c});
  
  const pg = prestigeGain();
  $("prestige").disabled = pg < 1;
  $("prestige").textContent = pg < 1 ? "Перезапуск модели (нужно ещё заработать)" : `Перезапуск модели: +${pg} весов (+${pg*10}% к доходу)`;
  
  ["auto","offline","perm2"].forEach(k=>{const own = k==="auto"?s.auto:k==="offline"?s.off:s.perm, e = $("s_"+k); e.disabled = !!own; e.textContent = own ? "Куплено" : ITEMS[k].p + " ⭐"});
  
  if(combo > 0 && Date.now() - comboT > 1000){combo = Math.max(0, combo-1); comboT = Date.now()-700}
  $("combo").textContent = combo >= 5 ? `КОМБО ×${combo}  (+${Math.min(combo,50)*2}%)` : "";
  $("cbar").style.width = Math.min(combo, 50)*2 + "%";
  
  const ch = $("chest"), left = st.next - Date.now();
  ch.hidden = false; ch.classList.toggle("ready", left <= 0);
  ch.textContent = left <= 0 ? "📦 Открыть ящик!" : "📦 Ящик через " + mmss(left);

  if(ev){$("evd").textContent = `${ev.d} · ${ev.n}/${ev.goal} · ${Math.ceil((ev.end-Date.now())/1000)}с`; $("evb").style.width = Math.min(100, ev.n/ev.goal*100) + "%";
    if(ev.n >= ev.goal) evEnd(true); else if(Date.now() > ev.end) evEnd(false)}
  else if(Date.now() > evNext) evStart();
  
  while(s.ach < MILES.length && s.tot >= MILES[s.ach]){toast(`🏆 Заработано ${fmt(MILES[s.ach])} токенов!`); hap("success","notificationOccurred"); const [x,y] = coreXY(); burst(x, y, 50, "#ffc93c", 8); s.ach++}
}

// ---------- офлайн-доход ----------
function initGame() {
  {const cap = (2 + s.oh + (s.off?6:0)) * 3600, sec = Math.min(cap, (Date.now()-s.last)/1000);
   if(sec > 30){const e = ps()*sec; gain(e); if(e > 0) setTimeout(() => toast(`Пока вас не было: +${fmt(e)} токенов`), 500)}}

  let prev = performance.now(), saveT = 0;
  setInterval(()=>{const n = performance.now(), dt = Math.min((n-prev)/1000, 1); prev = n;
    gain(ps()*dt); if(s.auto) gain(3*tapPow()*dt);
    ui(); saveT += dt; if(saveT > 2){saveT = 0; save()}}, 100);
  document.addEventListener("visibilitychange", save);

  refresh(); ui();
}

// ---------- тап ----------
const core = $("core");
function fly(x, y, txt, crit){const f = document.createElement("div"); f.className = "fly" + (crit ? " crit" : ""); f.textContent = txt; f.style.left = (x-20+(Math.random()*40-20)) + "px"; f.style.top = (y-30) + "px"; document.body.appendChild(f); setTimeout(() => f.remove(), 900)}
$("tap").addEventListener("pointerdown", e => {
  combo++; comboT = Date.now(); if(ev?.type === "heat") ev.n++;
  const crit = Math.random() < 0.08 + 0.01*s.cr;
  const v = tapPow() * (1 + Math.min(combo,50)*0.02) * (crit ? 5 : 1); gain(v);
  core.animate([{transform:"scale(.9)"}, {transform:"scale(1)"}], {duration:140, easing:"ease-out"});
  fly(e.clientX, e.clientY, (crit ? "КРИТ " : "+") + fmt(v), crit);
  burst(e.clientX, e.clientY, crit ? 26 : 7, crit ? "#ffc93c" : "#5df2c4", crit ? 8 : 4.5);
  if(crit){core.classList.remove("shake"); void core.offsetWidth; core.classList.add("shake"); hap("heavy")}else hap("light")});

// ---------- золотая звезда ----------
function spawnGold(){
  const el = document.createElement("div"); el.className = "gold"; el.textContent = "⭐";
  const y = H * (0.2 + Math.random()*0.35), dy = (Math.random()-0.5)*160; el.style.top = y + "px"; document.body.appendChild(el);
  const a = el.animate([{transform:"translate(-70px,0) rotate(0)"}, {transform:`translate(${W*0.5}px,${dy}px) rotate(360deg) scale(1.15)`}, {transform:`translate(${W+70}px,${-dy}px) rotate(720deg)`}], {duration:7000, easing:"linear"});
  a.onfinish = () => el.remove();
  el.addEventListener("pointerdown", ev2 => {ev2.stopPropagation(); const r = el.getBoundingClientRect(); burst(r.left+29, r.top+29, 45, "#ffc93c", 8); el.remove(); hap("success","notificationOccurred");
    if(Math.random() < 0.5){const v = Math.max(ps()*120, tapPow()*80)+50; gain(v); toast(`⭐ Золотой токен: +${fmt(v)}`)}
    else{s.fr = Date.now()+20000; toast("🔥 Безумие! Доход ×7 на 20 секунд")}});
  setTimeout(spawnGold, 25000 + Math.random()*25000)}
setTimeout(spawnGold, 10000);

// ---------- покупки ----------
$("gens").addEventListener("click", e => {const i = e.target.dataset.g; if(i == null) return; const c = gCost(+i);
  if(s.t >= c){s.t -= c; s.g[i]++; hap("selection","selectionChanged");
    const row = $("r"+i); row.classList.remove("pop"); void row.offsetWidth; row.classList.add("pop");
    const [x,y] = coreXY(); burst(x, y, 18, GENS[i][3], 6)}});
$("ups").addEventListener("click", e => {const u = UP.find(x => x.k === e.target.dataset.u); if(!u) return; const c = uCost(u); if(s[u.k] < u.m && s.t >= c){s.t -= c; s[u.k]++; hap("light"); const [x,y] = coreXY(); burst(x, y, 14, "#5df2c4", 5)}});

// ---------- престиж ----------
$("prestige").onclick = () => {const pg = prestigeGain(); if(pg < 1) return;
  const go = () => {const keep = {w:s.w+pg, auto:s.auto, off:s.off, perm:s.perm, bu:s.bu, bm:s.bm, im:s.im, iu:s.iu, cr:s.cr, oh:s.oh, ev:s.ev, tot:s.tot, ach:s.ach}; s = Object.assign(def(), keep); shown = 0;
    const [x,y] = coreXY(); burst(x, y, 90, "#b27bff", 10); toast(`🧠 Новая модель: +${pg} весов`)};
  tg?.showConfirm ? tg.showConfirm(`Сбросить ферму и получить ${pg} весов?`, ok => ok && go()) : (confirm("Сбросить ферму?") && go())};

// ---------- донаты за Telegram Stars ----------
function grant(id){
  const it = ITEMS[id], H3 = 3600e3;
  if(id === "boost2" || id === "boost5"){const m = id === "boost2" ? 2 : 5; s.bm = boostOn() ? Math.max(s.bm, m) : m; s.bu = (boostOn() ? s.bu : Date.now()) + H3}
  else if(id === "auto") s.auto = 1; else if(id === "offline") s.off = 1; else if(id === "perm2") s.perm = 1;
  save(); hap("success","notificationOccurred"); toast("✨ Спасибо! " + it.n); burst(W/2, H/2, 80, "#ffc93c", 10);
  refresh();
}
$("items").addEventListener("click", async e => {
  const id = e.target.dataset.i; if(!id) return;
  const r = await api("/invoice", {item:id});
  if(!r || !r.link) return toast("⚠️ Ошибка создания счета");
  if(tg?.openInvoice){
    tg.openInvoice(r.link, x => { if(x === "paid") grant(id); else if(x === "failed") tg.showAlert("Оплата отменена"); });
  } else {
    if(confirm(`ТЕСТ: Оплатить «${ITEMS[id].n}»?`)) { grant(id); }
  }
});
</script>
</body>
</html>
