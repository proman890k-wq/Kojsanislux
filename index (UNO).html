<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>UNO Online</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg0:#05070f; --bg1:#0b1026; --bg2:#151c44; --panel:rgba(255,255,255,.07); --panel2:rgba(255,255,255,.12);
  --txt:#f2f5ff; --muted:#9aa5d0; --accent:#ffc72e; --good:#1fc46a; --bad:#ff4d5e; --blue:#2f7bff;
  --cw:clamp(54px,17vw,74px);
  --safe-t:max(env(safe-area-inset-top,0px),var(--tg-content-safe-area-inset-top,0px));
  --safe-b:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
}
@media (max-height:640px){:root{--cw:clamp(44px,14vw,58px)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:relative;margin:0 auto;width:min(100vw,480px);height:100vh;height:100dvh;height:var(--tg-viewport-stable-height,100dvh);
  overflow:hidden;background:radial-gradient(120% 70% at 50% -5%,#1d2766 0%,var(--bg1) 52%,var(--bg0) 100%)}
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center;background:#02030a}
  #app{height:min(100dvh,900px);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}
}
#screen{position:absolute;inset:var(--safe-t) 0 0 0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px calc(var(--safe-b) + 14px);animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- общие элементы ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;
  font-weight:700;font-size:17px;background:var(--panel2);border:1px solid rgba(255,255,255,.1);transition:transform .12s,filter .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffd75a,#ffb300);color:#2a1d00;border-color:#ffe28a;box-shadow:0 6px 18px rgba(255,179,0,.3)}
.btn.blue{background:linear-gradient(180deg,#4a90ff,#1f5fe0);border-color:#7db0ff;box-shadow:0 6px 18px rgba(47,123,255,.3)}
.btn.green{background:linear-gradient(180deg,#2fd47c,#12994f);border-color:#6df0a8}
.btn.red{background:linear-gradient(180deg,#ff6676,#d1243a);border-color:#ff9aa5}
.btn.small{min-height:40px;font-size:14px;border-radius:12px;padding:0 12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--panel);font-size:12px;color:var(--muted);white-space:nowrap}
.card-panel{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.big-emoji{font-size:56px}
.title{font-size:22px;font-weight:800}
h3{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* ---------- аватары ---------- */
.avatar{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;overflow:hidden;flex:none;border:2px solid rgba(255,255,255,.25)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ---------- главное меню ---------- */
.logo{display:flex;flex-direction:column;align-items:center;margin:4px 0 14px}
.logo-row{display:flex;gap:8px;transform:rotate(-4deg)}
.logo-row span{width:64px;height:86px;border-radius:14px;border:4px solid #fff;display:flex;align-items:center;justify-content:center;
  font-size:46px;font-weight:900;font-style:italic;box-shadow:0 10px 24px rgba(0,0,0,.5);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo-row span:nth-child(1){background:linear-gradient(150deg,#ff5a68,#c8102e);transform:rotate(-6deg)}
.logo-row span:nth-child(2){background:linear-gradient(150deg,#ffd75a,#e09a00);transform:translateY(-4px)}
.logo-row span:nth-child(3){background:linear-gradient(150deg,#4a90ff,#1649b8);transform:rotate(6deg)}
.logo small{margin-top:10px;letter-spacing:.5em;font-size:12px;color:var(--muted);font-weight:700}
.profile{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.profile .nm{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-btns{display:flex;flex-direction:column;gap:10px;flex:1;justify-content:center}
.menu-btns .btn{min-height:56px;justify-content:flex-start;padding-left:20px}

/* ---------- листы (модальные окна) ---------- */
#sheet:empty{display:none}
.backdrop{position:absolute;inset:0;z-index:40;background:rgba(2,4,12,.66);display:flex;align-items:flex-end;animation:fadeBg .2s}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:92%;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a2255,#10173b);
  border-radius:26px 26px 0 0;border:1px solid rgba(255,255,255,.1);border-bottom:0;animation:slideUp .25s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sheet-title{font-size:20px;font-weight:800}
.sheet-body{overflow-y:auto;padding:8px 18px calc(var(--safe-b) + 18px);display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
.field input[type=text],.field input[type=password]{width:100%;height:50px;border-radius:14px;border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.28);color:var(--txt);padding:0 14px;font-size:17px;outline:none}
.field input:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:44px;border-radius:12px;background:var(--panel);border:1px solid rgba(255,255,255,.08);font-weight:700}
.seg button.on{background:linear-gradient(180deg,#ffd75a,#ffb300);color:#2a1d00;border-color:#ffe28a}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.toggle .sw{width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;flex:none}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on .sw{background:var(--good)}
.toggle.on .sw::after{transform:translateX(22px)}
.toggle small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.room-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.08);text-align:left;width:100%}
.room-item .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(31,196,106,.2);color:#6df0a8}
.badge.busy{background:rgba(255,199,46,.18);color:#ffd75a}

/* ---------- лобби ---------- */
.lobby-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lobby-head .t{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.codebox{display:flex;align-items:center;gap:10px;justify-content:space-between}
.code{font-size:36px;font-weight:900;letter-spacing:.18em;color:var(--accent);font-variant-numeric:tabular-nums}
.plist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.07)}
.prow.empty{border-style:dashed;color:var(--muted);justify-content:center;background:transparent;min-height:64px}
.prow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sub{font-size:12px;color:var(--muted)}
.prow.off{opacity:.55}

/* ---------- игровое поле ---------- */
.game{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;padding-bottom:calc(var(--safe-b) + 6px)}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px 4px}
.topbar .rc{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.topbar .rn{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .rcode{font-size:11px;color:var(--muted);letter-spacing:.12em}
.opps{display:flex;justify-content:center;gap:10px;padding:2px 8px;min-height:92px}
.opp{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;padding:4px 0}
.ring{--p:0;--rc:var(--good);border-radius:50%;padding:3px;background:conic-gradient(var(--rc) calc(var(--p)*1%),rgba(255,255,255,.12) 0);transition:filter .2s}
.ring.urgent{--rc:var(--bad)}
.opp.turn .ring{filter:drop-shadow(0 0 10px rgba(255,199,46,.9))}
.opp.turn .ring{--rc:var(--accent)}
.opp .nm{font-size:12px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .meta{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.cnt{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.4);border-radius:999px;padding:1px 8px;font-weight:800;color:#fff;font-size:12px}
.minis{display:flex;height:14px}
.mini{width:10px;height:14px;border-radius:2px;background:linear-gradient(135deg,#ff3d4f,#ff8a3d);border:1px solid #fff;margin-left:-5px}
.mini:first-child{margin-left:0}
.opp.gone{opacity:.5}
.tag{position:absolute;top:0;right:4px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;background:var(--bad);color:#fff}
.tag.uno{background:var(--accent);color:#2a1d00}
.catch-btn{position:absolute;bottom:-6px;z-index:5;padding:6px 12px;border-radius:999px;background:linear-gradient(180deg,#ff6676,#d1243a);
  font-weight:900;font-size:12px;border:2px solid #fff;animation:pulse .6s infinite alternate}
.table{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(14px,6vw,30px);position:relative}
.table::before{content:"";position:absolute;width:min(86%,330px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(47,123,255,.16),rgba(47,123,255,0) 68%);pointer-events:none}
.dir{position:absolute;font-size:30px;color:rgba(255,255,255,.2);pointer-events:none;animation:spin 8s linear infinite}
.dir.ccw{animation-direction:reverse}
.deckwrap,.pilewrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.deck{position:relative;cursor:pointer}
.deck.can{animation:pulse .8s infinite alternate;filter:drop-shadow(0 0 10px rgba(255,199,46,.8))}
.deck .stackfx{position:absolute;inset:0;border-radius:calc(var(--cw)*.14);background:#10173b;border:2px solid #fff;transform:translate(3px,3px);z-index:-1}
.deck .n{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.pile{position:relative}
.pile .ringc{position:absolute;inset:-9px;border-radius:calc(var(--cw)*.24);border:4px solid var(--cc,#fff);box-shadow:0 0 24px var(--cc,#fff),inset 0 0 14px var(--cc,#fff);transition:border-color .3s,box-shadow .3s}
.cname{font-size:12px;font-weight:800;margin-top:12px;padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.4)}
.status{text-align:center;font-size:14px;font-weight:700;min-height:20px;padding:0 12px;margin-bottom:2px}
.status.mine{color:var(--accent)}
.mebar{display:flex;align-items:center;gap:10px;padding:2px 12px}
.mebar .nm{font-weight:800;font-size:14px}
.tbar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i{display:block;height:100%;width:calc(var(--p,0)*1%);background:var(--good);border-radius:99px}
.tbar.urgent i{background:var(--bad)}
.actions{display:flex;gap:8px;padding:6px 12px}
.actions .btn{flex:1;min-height:48px;font-size:15px}
.unobtn{flex:0 0 96px!important;background:linear-gradient(180deg,#ff6676,#d1243a)!important;border:2px solid #fff!important;font-weight:900;font-size:20px!important;letter-spacing:.04em}
.unobtn.pulse{animation:pulse .5s infinite alternate}
.hand-scroll{overflow-x:auto;overflow-y:hidden;padding:20px 8px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hand-scroll::-webkit-scrollbar{display:none}
.hand{display:flex;align-items:flex-end;min-height:calc(var(--cw)*1.5)}
.hand .card{cursor:pointer}
.hand .card.playable{transform:translateY(-8px);box-shadow:0 0 0 2px var(--accent),0 0 16px rgba(255,199,46,.7),0 6px 12px rgba(0,0,0,.5)}
.hand .card.dim{filter:brightness(.5) saturate(.6)}
.hand .card.selected{transform:translateY(-22px) scale(1.06);z-index:5}
.hand .card.newcard{animation:dealIn .45s cubic-bezier(.2,.8,.2,1) both}
.hand .card.shake{animation:shake .3s}
@keyframes dealIn{from{transform:translate(0,-240px) scale(.5) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}20%{transform:scale(1.15);opacity:1}80%{transform:scale(1);opacity:1}100%{transform:scale(1.05) translateY(-20px);opacity:0}}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}

/* ---------- карты ---------- */
.card{--c1:#555;--c2:#333;--cc:#333;position:relative;width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.14);
  background:linear-gradient(150deg,var(--c1),var(--c2));border:calc(var(--cw)*.05) solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.45);
  flex:none;overflow:hidden;color:#fff;font-weight:900;transition:transform .18s,filter .18s,box-shadow .18s}
.card::before{content:"";position:absolute;left:-18%;right:-18%;top:20%;bottom:20%;background:#fff;border-radius:50%;transform:rotate(-28deg)}
.card .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--cc);font-size:calc(var(--cw)*.5);font-style:italic;letter-spacing:-.04em}
.card .corner{position:absolute;font-size:calc(var(--cw)*.21);line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.card .tl{left:calc(var(--cw)*.07);top:calc(var(--cw)*.05)}
.card .br{right:calc(var(--cw)*.07);bottom:calc(var(--cw)*.05);transform:rotate(180deg)}
.c-R{--c1:#ff5a68;--c2:#c8102e;--cc:#d8182f}
.c-B{--c1:#4a90ff;--c2:#1649b8;--cc:#1f5fe0}
.c-G{--c1:#2fd47c;--c2:#0d8a47;--cc:#12994f}
.c-Y{--c1:#ffd75a;--c2:#e09a00;--cc:#d98f00}
.c-W{--c1:#2a2f45;--c2:#0a0d19}
.c-W::before{background:conic-gradient(#ff3d4f 0 25%,#ffc72e 0 50%,#1fc46a 0 75%,#2f7bff 0)}
.c-W .center{color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.7)}
.card.back{background:radial-gradient(circle at 50% 35%,#2b3568,#0b1030)}
.card.back::before{background:linear-gradient(135deg,#ff3d4f,#ff8a3d)}
.card.back .center{color:#fff;font-size:calc(var(--cw)*.3);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.card.flying{position:fixed;transform-origin:0 0;pointer-events:none}

/* ---------- слой эффектов ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);padding:10px 22px;border-radius:20px;font-size:26px;font-weight:900;
  background:rgba(8,12,34,.86);border:3px solid var(--bc,#fff);color:var(--bc,#fff);box-shadow:0 0 30px var(--bc,#fff);animation:pop 1.25s ease forwards;
  white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.flash{position:absolute;inset:0;animation:flash .7s ease forwards}
#toast{position:absolute;top:calc(var(--safe-t) + 8px);left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{padding:9px 16px;border-radius:14px;background:rgba(10,14,38,.94);border:1px solid rgba(255,255,255,.18);font-size:14px;font-weight:600;
  max-width:92%;text-align:center;animation:fadeIn .2s}
.toast.err{border-color:var(--bad);color:#ffb3bb}
.toast.ok{border-color:var(--good)}
#conn{position:absolute;inset:0;z-index:90;background:rgba(3,5,14,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#conn[hidden]{display:none}

/* ---------- итоги раунда ---------- */
.results{position:absolute;inset:0;z-index:30;background:rgba(3,5,14,.84);display:flex;flex-direction:column;justify-content:center;padding:16px;animation:fadeBg .3s;overflow-y:auto}
.res-card{background:linear-gradient(180deg,#1a2255,#10173b);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.crown{font-size:48px;text-align:center;animation:pop2 1s ease}
@keyframes pop2{from{transform:scale(.3) rotate(-20deg)}to{transform:none}}
.res-title{text-align:center;font-size:22px;font-weight:900}
.res-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel)}
.res-row.win{background:rgba(255,199,46,.15);border:1px solid rgba(255,199,46,.5)}
.res-row .pts{font-weight:900;color:var(--accent)}
.prog{height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2fd47c,#ffc72e)}

/* ---------- статистика ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:12px;border-radius:14px;background:var(--panel);text-align:center}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;color:var(--muted)}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel)}
.lb-row.you{background:rgba(255,199,46,.14);border:1px solid rgba(255,199,46,.5)}
.lb-row .rk{width:24px;text-align:center;font-weight:900;color:var(--muted)}
.scroll{flex:1;min-height:0;overflow-y:auto}
.busy .btn,.busy .deck,.busy .card{pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body.lite *{animation-duration:.01ms!important}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
  <div id="conn" hidden><div class="spinner"></div><div class="title" id="conn-title">Соединение потеряно</div><div class="muted" id="conn-text">Пытаемся переподключиться…</div></div>
</div>
<div id="fx"></div>

<script>
'use strict';
(() => {
/* =========================================================================
   НАСТРОЙКА. Меняется только этот блок.
   ========================================================================= */
const CONFIG = {
  // Адрес Python-сервера. Пустая строка = тот же хост, который отдал эту страницу
  // (когда server.py отдаёт index.html сам). Для GitHub Pages укажите, например:
  // "wss://my-uno-server.onrender.com"
  SERVER_URL: "",
  // Ссылка на Mini App в Telegram для приглашений (https://t.me/<бот>/<короткое_имя_приложения>)
  BOT_LINK: "https://t.me/YOUR_BOT/app",

  evs.forEach(e => { S.lastEid = Math.max(S.lastEid, e.eid); });

function layoutHand() {
  const sc = $('.hand-scroll'); if (!sc) return;
  const hand = $('.hand', sc), cards = [...hand.children]; if (!cards.length) return;
  const n = cards.length, cw = cards[0].offsetWidth || 60, W = sc.clientWidth - 16;
  let step = n > 1 ? Math.min(cw * 0.9, (W - cw) / (n - 1)) : 0, scrolls = false;
  const MIN = Math.max(26, cw * 0.42);
  if (n > 1 && step < MIN) { step = MIN; scrolls = true; }
  ui.overlapping = n > 1 && step < cw * 0.7;
  cards.forEach((c, i) => { c.style.marginLeft = i === 0 ? '0' : `${step - cw}px`; });
  hand.style.width = (cw + step * (n - 1)) + 'px';
  hand.style.margin = scrolls ? '0' : '0 auto';
  sc.style.overflowX = scrolls ? 'auto' : 'hidden';
}
window.addEventListener('resize', () => { layoutHand(); });

function onCardTap(c, el) {
  const R = S.room; if (!R || R.status !== 'playing') return;
  const G = R.game, myTurn = G.turn === R.you;
  if (!myTurn) { toast('Сейчас не ваш ход'); return; }
  if (!G.playable.includes(c.id)) {
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    Snd.play('error'); vib('error');
    if (G.pending) toast('Нужно ответить такой же картой «+» или взять штраф');
    else if (c.value === 'wild4') toast('«+4» можно сыграть, только если нет карты текущего цвета');
    else toast('Эту карту нельзя сыграть');
    return;
  }
  if (ui.overlapping && ui.selected !== c.id) { ui.selected = c.id; Snd.play('click'); render(); return; }
  ui.selected = null;
  if (c.color === 'W') pickColor(col => playCard(c.id, col));
  else playCard(c.id, null);
}
function playCard(id, color) { act('play_card', color ? { card_id: id, color } : { card_id: id }); }
function drawCard() {
  const R = S.room; if (!R || R.status !== 'playing') return;
  if (!R.game.can_draw) { toast(R.game.turn === R.you ? 'Вы уже взяли карту' : 'Сейчас не ваш ход'); return; }
  act('draw_card');
}
function pickColor(cb) {
  openSheet('Выберите цвет', h('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:12px' },
    ['R', 'Y', 'G', 'B'].map(c => h('button', { class: 'btn', style: `height:84px;font-size:18px;background:${COLOR_HEX[c]};color:#10143a;border:3px solid #fff`, onClick: () => { closeSheet(); cb(c); } }, COLOR_NAMES[c]))));
}
function openGameMenu() {
  const R = S.room, isOwner = R.owner === R.you;
  openSheet('Меню', [
    toggle('🔊 Звук', null, Settings.sound, v => { Settings.sound = v; Settings.save(); }),
    toggle('✨ Облегчённые анимации', null, Settings.lite, v => { Settings.lite = v; Settings.save(); }),
    h('div', { class: 'muted', style: 'font-size:13px' }, `Код комнаты: ${R.code} · ${R.stacking ? 'наложение штрафов включено' : 'штрафы не накладываются'}`),
    h('button', { class: 'btn small', onClick: () => copyText(R.code) }, '📋 Скопировать код'),
    h('button', { class: 'btn small', onClick: () => { closeSheet(); invite(R); } }, '✈️ Пригласить друзей'),
    h('button', { class: 'btn red', onClick: () => { closeSheet(); leaveRoom(); } }, '🚪 Выйти из матча'),
    isOwner ? h('button', { class: 'btn small red', onClick: () => { closeSheet(); confirmDialog('Закрыть комнату для всех игроков?', 'Закрыть', () => act('close_room'), true); } }, 'Закрыть комнату') : null,
  ]);
}

/* ----- итоги раунда ----- */
function resultsView(R) {
  const res = R.game.result, me = R.you; if (!res) return h('div');
  const isOwner = R.owner === me, over = res.match_over, won = res.winner === me;
  const rows = [...res.players].sort((a, b) => (b.id === res.winner) - (a.id === res.winner) || b.score - a.score).map(p => h('div', { class: 'res-row' + (p.id === res.winner ? ' win' : '') },
    avatar(p, 38),
    h('div', { class: 'grow' }, h('div', { style: 'font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, (p.id === res.winner ? '👑 ' : '') + p.name + (p.id === me ? ' (вы)' : '')),
      h('div', { class: 'muted', style: 'font-size:12px' }, p.id === res.winner ? 'Карт не осталось' : `Осталось карт: ${p.cards} (${p.hand_points} очк.)`),
      h('div', { class: 'prog' }, h('i', { style: `width:${Math.min(100, p.score / res.target * 100)}%` }))),
    h('div', { style: 'text-align:right' }, p.id === res.winner ? h('div', { class: 'pts' }, '+' + res.points) : null, h('div', { style: 'font-weight:800' }, p.score))));
  return h('div', { class: 'results' }, h('div', { class: 'res-card' },
    h('div', { class: 'crown' }, over ? '🏆' : (won ? '🎉' : '🃏')),
    h('div', { class: 'res-title' }, over ? `Матч выиграл ${res.winner_name}!` : (won ? 'Вы выиграли раунд!' : `Раунд выиграл ${res.winner_name}`)),
    h('div', { class: 'muted', style: 'text-align:center;font-size:13px' }, over ? `Достигнуто ${res.target} очков` : `До победы в матче: ${res.target} очков`),
    rows,
    isOwner ? h('button', { class: 'btn primary', onClick: () => act('next_round') }, over ? '🔁 Реванш' : '▶ Следующий раунд') : h('div', { class: 'muted', style: 'text-align:center;padding:6px' }, '⏳ Ждём решения владельца…'),
    h('div', { class: 'row' },
      isOwner ? h('button', { class: 'btn small grow', onClick: () => act('return_to_lobby') }, '↩ Вернуться в лобби') : null,
      h('button', { class: 'btn small red grow', onClick: () => act('leave_room') }, 'Выйти'))));
}

/* ========================= таймеры ========================= */
function updateTimers() {
  const R = S.room, G = R && R.game, t = now();
  const live = R && R.status === 'playing' && G;
  document.querySelectorAll('[data-ring]').forEach(el => {
    let p = 0, urgent = false;
    if (live && G.turn_deadline && el.dataset.ring === G.turn) {
      const rem = Math.max(0, G.turn_deadline - t); p = Math.min(100, rem / R.turn_time * 100); urgent = rem <= 8;
    }
    el.style.setProperty('--p', p.toFixed(1)); el.classList.toggle('urgent', urgent);
  });
  const tb = $('#tbar'), tl = $('#tleft');
  if (tb && tl) {
    if (live && G.turn === R.you && G.turn_deadline) {
      const rem = Math.max(0, G.turn_deadline - t);
      tb.style.setProperty('--p', Math.min(100, rem / R.turn_time * 100).toFixed(1)); tb.classList.toggle('urgent', rem <= 8); tl.textContent = Math.ceil(rem) + ' с';
    } else { tb.style.setProperty('--p', 0); tl.textContent = ''; }
  }
  document.querySelectorAll('[data-catch]').forEach(el => { el.hidden = !(live && G.uno && t < G.uno.until && G.uno.pid === el.dataset.catch); });
}
setInterval(updateTimers, 250);

/* ========================= запуск ========================= */
async function checkServer() {
  for (let i = 0; i < 10; i++) {
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 5000);
      await fetch(healthUrl(), { cache: 'no-store', mode: 'no-cors', signal: ctl.signal });
      clearTimeout(tm); return true;
    } catch (e) {}
    S.loadingMsg = i < 1 ? 'Проверяем сервер…' : `Сервер просыпается… (${i + 1}/10)`; render();
    await sleep(3000);
  }
  return false;
}
async function boot() {
  S.screen = 'loading'; S.loadingMsg = 'Проверяем сервер…'; render();
  if (!(tg && tg.initData) && !devUser()) {
    S.screen = 'error'; S.errorEmoji = '✈️'; S.errorMsg = 'Откройте игру через Telegram: найдите бота и нажмите кнопку запуска приложения.'; S.retry = null; return render();
  }
  if (!(await checkServer())) {
    S.screen = 'error'; S.errorEmoji = '📡'; S.errorMsg = 'Сервер недоступен. Возможно, он ещё запускается — попробуйте через минуту.'; S.retry = boot; return render();
  }
  S.loadingMsg = 'Подключаемся…'; render();
  Net.stopped = false; Net.attempt = 0; Net.connect();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden || Net.stopped || !S.user) return;
  if (!Net.ws) { Net.attempt = 0; clearTimeout(Net.retryTimer); Net.connect(); }
  else if (S.authed) Net.sendRaw({ type: 'request_state' });
});
window.addEventListener('online', () => { if (!Net.stopped && S.user && !Net.ws) { Net.attempt = 0; clearTimeout(Net.retryTimer); Net.connect(); } });
document.addEventListener('pointerdown', () => Snd.ensure(), { once: true });
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') closeSheet();
  if (!S.room || S.room.status !== 'playing' || $('#sheet').firstChild) return;
  if (e.key === 'd' || e.key === 'D' || e.key === ' ') { e.preventDefault(); drawCard(); }
  if (e.key === 'u' || e.key === 'U') act('call_uno', {}, true);
});

if (tg) {
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#0b1026'); tg.setBackgroundColor && tg.setBackgroundColor('#0b1026');
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
    if (tg.BackButton) tg.BackButton.onClick(() => { if ($('#sheet').firstChild) closeSheet(); else go('menu'); });
    const sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
    if (sp && /^[A-Za-z0-9]{4,8}$/.test(sp)) S.startParam = sp.toUpperCase();
  } catch (e) {}
}
{
  const q = new URLSearchParams(location.search).get('join');
  if (q && /^[A-Za-z0-9]{4,8}$/.test(q)) S.startParam = q.toUpperCase();
}
Settings.load();
boot();
})();
</script>
</body>
